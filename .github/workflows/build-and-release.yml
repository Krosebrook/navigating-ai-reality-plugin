name: Validate Plugin & Package Release Suite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 10-Gate Production Plugin Validator (v3.0.0 - 11 MCP Tools / 39 Notebooks)
        run: |
          python3 skills/navigating-ai-reality/scripts/validate_production_plugin.py

      - name: Package & Verify Production Plugin ZIP Archive
        run: |
          zip -r navigating-ai-reality-plugin-v3.0.0.zip .claude-plugin .claude commands skills companion-deliverables .mcp.json .env.example install.sh requirements.txt LICENSE README.md
          unzip -t navigating-ai-reality-plugin-v3.0.0.zip
