name: Validate Plugin & Package Release Suite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 12-Gate Production Plugin Validator (v3.0.0 - 11 MCP Tools / 39 Notebooks / HTTP ASGI / Parity)
        run: |
          python3 skills/navigating-ai-reality/scripts/validate_production_plugin.py

      - name: Package & Verify Production Plugin ZIP Archive
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ARCHIVE_TAG="${GITHUB_REF_NAME}"
          else
            ARCHIVE_TAG="dev-${GITHUB_SHA::7}"
          fi
          ZIP_NAME="navigating-ai-reality-plugin-${ARCHIVE_TAG}.zip"
          zip -r "${ZIP_NAME}" \
            .claude-plugin .claude commands skills companion-deliverables \
            reality_lens_http_app.py Dockerfile .dockerignore render.yaml scripts \
            .mcp.json .env.example install.sh requirements.txt LICENSE README.md
          unzip -t "${ZIP_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Upload Binary ZIP & Companion Deliverables to Tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes --repo "${{ github.repository }}"
          gh release upload "${GITHUB_REF_NAME}" \
            "${ZIP_NAME}" \
            companion-deliverables/claude_reality_lens_plugin.html \
            companion-deliverables/reality_lens_citizen_field_guide.md \
            companion-deliverables/reality_lens_companion_workbook.csv \
            companion-deliverables/reality_lens_prompt_and_template_pack.md \
            --repo "${{ github.repository }}" \
            --clobber
